<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Haptic probe</title>
    <style>
        body {
            font: 16px -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 16px 16px 48px;
            background: #1c1c1e;
            color: #f2f2f7;
        }

        h1 { font-size: 20px; }

        p.note { color: #98989f; font-size: 14px; line-height: 1.4; }

        button.probe {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 16px;
            font: inherit;
            text-align: left;
            border: 0;
            border-radius: 12px;
            background: #3a3a3c;
            color: inherit;
        }

        button.probe:active { background: #545458; }

        button.probe b { display: block; font-size: 15px; }
        button.probe span { display: block; color: #98989f; font-size: 13px; margin-top: 4px; }

        #env { white-space: pre-wrap; font: 13px ui-monospace, monospace; color: #98989f; }

        /* The variants differ only in how the control is hidden, so each one gets its own
           rule rather than sharing one. */
        .v-hidden { display: none; }

        .v-invisible,
        .v-visible {
            position: fixed;
            bottom: 0;
            left: 0;
            margin: 0;
            width: 1px;
            height: 1px;
            pointer-events: none;
        }

        .v-invisible { opacity: 0; }
        .v-visible { opacity: 1; }

        .v-onscreen { margin: 10px 0; }
    </style>
</head>

<body>
    <h1>iOS haptic probe</h1>
    <p class="note">
        Tap each button and note which ones you actually feel. Check first that
        Settings &rsaquo; Sounds &amp; Haptics &rsaquo; System Haptics is on, that Low Power
        Mode is off, and that the phone is not on silent with haptics suppressed.
    </p>

    <div id="probes"></div>

    <p class="note">Environment:</p>
    <div id="env"></div>

    <script>
        const supportsSwitch = 'switch' in document.createElement('input');

        // Each variant is built once and reused, the way the game would use it — a control
        // created fresh per tap is a different thing to test.
        function build(hostClass, attachTo) {
            const label = document.createElement('label');
            label.className = hostClass;
            label.setAttribute('aria-hidden', 'true');

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.setAttribute('switch', '');
            input.tabIndex = -1;

            label.appendChild(input);
            (attachTo || document.body).appendChild(label);

            return { label, input };
        }

        const hiddenInHead = build('v-hidden', document.head);
        const invisible = build('v-invisible');
        const visible = build('v-visible');
        const onscreen = build('v-onscreen');

        const probes = [
            {
                name: '1. display:none label in <head>, click label',
                hint: 'The recipe the ios-haptics package uses.',
                run: () => hiddenInHead.label.click(),
            },
            {
                name: '2. rendered 1px opacity:0, click label',
                hint: 'What the game does, but clicking the label instead of the input.',
                run: () => invisible.label.click(),
            },
            {
                name: '3. rendered 1px opacity:0, click input',
                hint: 'Exactly what the game does today.',
                run: () => invisible.input.click(),
            },
            {
                name: '4. rendered 1px opacity:1, click label',
                hint: 'Tests whether opacity:0 is what suppresses it.',
                run: () => visible.label.click(),
            },
            {
                name: '5. fully visible switch on the page, click label',
                hint: 'If even this is silent, the trick is gone on this iOS version.',
                run: () => onscreen.label.click(),
            },
            {
                name: '6. set .checked + dispatch change',
                hint: 'Expected to be silent; here to confirm a real click is required.',
                run: () => {
                    invisible.input.checked = !invisible.input.checked;
                    invisible.input.dispatchEvent(new Event('change', { bubbles: true }));
                },
            },
            {
                name: '7. variant 2, twice, 90ms apart',
                hint: 'The double tick the game uses for removing a flag.',
                run: () => {
                    invisible.label.click();
                    setTimeout(() => invisible.label.click(), 90);
                },
            },
            {
                name: '8. variant 2, delayed 600ms',
                hint: 'Tests whether firing outside the tap gesture kills the haptic.',
                run: () => setTimeout(() => invisible.label.click(), 600),
            },
            {
                name: '9. navigator.vibrate(35)',
                hint: 'Expected to be missing on iOS; confirms the fallback path is the one in play.',
                run: () => navigator.vibrate ? navigator.vibrate(35) : alert('navigator.vibrate is not available'),
            },
        ];

        const host = document.getElementById('probes');

        for (const probe of probes) {
            const button = document.createElement('button');
            button.className = 'probe';
            button.type = 'button';
            button.innerHTML = '<b></b><span></span>';
            button.querySelector('b').textContent = probe.name;
            button.querySelector('span').textContent = probe.hint;
            button.addEventListener('click', probe.run);
            host.appendChild(button);
        }

        // Variant 5 wants the switch where a finger can see it, so it is moved next to its
        // own button rather than left at the bottom of the page.
        document.querySelectorAll('.probe')[4].after(onscreen.label);

        document.getElementById('env').textContent = [
            'switch supported: ' + supportsSwitch,
            'navigator.vibrate: ' + (navigator.vibrate ? 'present' : 'absent'),
            'standalone: ' + (window.navigator.standalone === true),
            'devicePixelRatio: ' + window.devicePixelRatio,
            'userAgent: ' + navigator.userAgent,
        ].join('\n');
    </script>
</body>

</html>
